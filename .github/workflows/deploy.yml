name: Auto Deploy testQ-backend to MilesWeb

on:
  push:
    branches:
      - production   # server iski git repo isi branch ko track karti hai

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to MilesWeb via SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" | tr -d '\r' > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          # Detect SSH port (fallback to 22 if unset)
          PORT="${SSH_PORT:-22}"

          # Add target host key to known_hosts to prevent interactive prompt
          ssh-keyscan -p "$PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

          # Connect via native OpenSSH with verbose debug (-v) and stream deploy script
          ssh -v -p "$PORT" \
            -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=30 \
            -o ServerAliveInterval=15 \
            -i ~/.ssh/id_rsa \
            "$SSH_USER@$SSH_HOST" "DEPLOY_PATH='$DEPLOY_PATH' bash -s" < .github/scripts/deploy.sh
